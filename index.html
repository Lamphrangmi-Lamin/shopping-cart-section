  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shopping Cart Section</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />

    <!-- Tailwind CDN allows you to use Tailwind classes immediately in your HTML without any installation steps. 
      If you're not using Tailwind, you may delete the <script> -->
    <!-- Get started on Tailwind: https://tailwindcss.com/docs/installation/play-cdn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="icon" href="img/favicon.ico" sizes="any" />
    <style>
      /* You may write styles inside this <style> tag or within `css/style.css`. */
    </style>
  </head>

  <body class="bg-gradient-to-r from-[#F9FAFB] to-[#D2D6DB] min-h-screen p-4">
    <div
      class="grid-container mx-auto items-start bg-white relative w-full px-4 py-12 shadow-sm rounded-md grid grid-cols-4 gap-x-4 md:grid-cols-6 md:py-16 md:gap-x-8 xl:grid-cols-12"
    >
      <!-- Heading text -->
      <h1
        class="col-span-4 text-3xl font-semibold text-neutral-900 mb-16 md:col-span-6 xl:col-span-12 xl:text-5xl"
      >
        Shopping Cart
      </h1>

      <!-- Left section -->
      <div
        id="cartItemsContainer"
        class="left-section col-span-4 md:col-span-6 xl:col-span-8"
      >
      <!-- Dynamic data -->
      </div>

      <!-- Right section -->
      <div
        class="right-section col-span-4 md:col-span-6 xl:col-span-4 border border-neutral-200 rounded-lg p-4 flex flex-col gap-y-8"
      >
        <h2 class="text-2xl font-semibold text-neutral-900">Order Summary</h2>
        <!-- subtotal & shipping -->
        <div class="">
          <div class="flex justify-between mb-4">
            <div class="text-neutral-600">Subtotal</div>
            <div id="subtotal" class="text-lg font-semibold text-neutral-900"></div>
          </div>
          <div class="shipping flex justify-between mb-4">
            <p class="text-neutral-600">Shipping</p>
            <p class="text-lg font-semibold">FREE</p>
          </div>

          <div class="coupon text-indigo-700 font-medium flex justify-end">
            <a
              aria-disabled="false"
              href="#"
              class="focus:ring-4 focus:ring-neutral-200 rounded px-1 aria-disabled:text-neutral-400"
              ><i class="ri-coupon-line"></i> Add coupon code</a
            >
          </div>

          <hr class="border-dotted border-t-2 my-8" />
        </div>
        <div class="total flex justify-between">
          <p class="text-2xl font-medium">Total</p>
          <p class="text-4xl font-semibold">$162.50</p>
        </div>
        <div class="checkout-button">
          <button
            class="font-medium w-full bg-indigo-700 text-white hover:bg-indigo-800 shadow-md focus:ring-4 focus:bg-indigo-800 focus:ring-neutral-200 disabled:bg-neutral-100 disabled:text-neutral-400 disabled:shadow-none py-3 rounded"
          >
            Checkout
          </button>
        </div>
      </div>
    </div>

  </body>
